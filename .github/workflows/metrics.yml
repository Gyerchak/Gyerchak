name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"  # daily, 02:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", ".github/scripts/darkify.py", ".github/scripts/rotate_calendar.py"]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-light.svg
          base: header, activity, repositories
          retries: 5
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_licenses: yes
          plugin_licenses_ratio: yes
          config_display: large

      - name: Rotate isometric calendar
        run: |
          cp /metrics_renders/github-metrics-light.svg ./github-metrics-light.svg
          python3 .github/scripts/rotate_calendar.py github-metrics-light.svg

      - name: Generate dark-mode variant
        run: python3 .github/scripts/darkify.py github-metrics-light.svg github-metrics-dark.svg

      - name: Bump image cache-buster in README
        run: |
          VERSION="v=$(date -u +%Y%m%d%H%M)"
          sed -i "s|github-metrics-light.svg#gh-light-mode-only|github-metrics-light.svg?$VERSION#gh-light-mode-only|" README.md
          sed -i "s|github-metrics-dark.svg#gh-dark-mode-only|github-metrics-dark.svg?$VERSION#gh-dark-mode-only|" README.md
          sed -i "s|src=\"./github-metrics-light.svg\"|src=\"./github-metrics-light.svg?$VERSION\"|" README.md

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics-light.svg github-metrics-dark.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub metrics"
            git pull --rebase origin main
            git push
          fi
