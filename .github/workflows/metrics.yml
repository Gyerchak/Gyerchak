name: Metrics

on:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics-light.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-light
          config_display: large

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics-dark.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-dark
          config_display: large

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics-light.svg github-metrics-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub metrics"
            git push
          fi
