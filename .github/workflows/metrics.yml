name: Metrics

on:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", ".github/scripts/darkify.py"]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics-light.svg
          base: header, activity, repositories
          retries: 5
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_skipped: html, css, dockerfile
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_display: large

      - name: Generate dark-mode variant
        run: python3 .github/scripts/darkify.py github-metrics-light.svg github-metrics-dark.svg

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics-light.svg github-metrics-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub metrics"
            git pull --rebase origin main
            git push
          fi
