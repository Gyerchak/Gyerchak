name: Update profile README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"
      - ".github/scripts/update_profile.py"
      - ".github/scripts/calendar.py"
      - ".github/scripts/darkify.py"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution calendars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/calendar.py
          python3 .github/scripts/darkify.py contributions.svg contributions-dark.svg

      - name: Generate README sections (pinned cards + repo list)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md contributions.svg contributions-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile (pins, repos, calendars)"
            git pull --rebase origin main
            git push
          fi
